overwrite: true
schema: "http://localhost:8080/graphql"
documents: "src/**/*.{ts,tsx}"
generates:
  src/shared/types/generated.ts:
    plugins:
      - "typescript"
      - "typescript-operations"
      - "typed-document-node"
    config:
      skipTypename: false
      withHooks: false
      withHOC: false
      withComponent: false
