spring:
  application:
    name: med-backend-test
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  flyway:
    enabled: true
    clean-disabled: false
  aop:
    auto: false

logging:
  level:
    root: INFO
    com.clinictraining: DEBUG
    org.hibernate.SQL: DEBUG
    org.testcontainers: INFO

security:
  jwt:
    secret: test-secret-key-for-integration-tests
